<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 거리 체크</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--tx:#1c2a1e;--sub:#6b7a6d;--ac:#2e7d32;--ln:#dfe6dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101510;--card:#1a221b;--tx:#e8f0e8;--sub:#8fa090;--ac:#66bb6a;--ln:#2a352b}}
:root[data-theme="dark"]{--bg:#101510;--card:#1a221b;--tx:#e8f0e8;--sub:#8fa090;--ac:#66bb6a;--ln:#2a352b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;padding:16px;max-width:480px;margin:0 auto}
h1{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.big{font-size:64px;font-weight:700;color:var(--ac);line-height:1.1}
.unit{font-size:20px;color:var(--sub)}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
button{font:inherit;border:0;border-radius:12px;padding:14px;width:100%;font-weight:600;background:var(--ac);color:#fff;margin-top:8px}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px}
ul{list-style:none;margin:0;padding:0;text-align:left}
li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
</style>
</head>
<body>
<h1>⛳ 골프 거리 체크</h1>
<div class="card">
  <div class="big" id="dist">--</div>
  <div class="unit" id="u">야드</div>
  <div class="sub" id="state">GPS 연결 중…</div>
</div>
<div class="card">
  <div class="sub" style="margin:0 0 4px">① 공 앞에서 [기준점 저장] → ② 공 떨어진 곳까지 걸어가서 거리 확인</div>
  <button id="set">📍 여기를 기준점으로 저장</button>
  <div class="row">
    <button class="alt" id="rec">📝 이 거리 기록</button>
    <button class="alt" id="unit">m / yd 전환</button>
  </div>
</div>
<div class="card"><div class="sub" style="margin:0 0 6px">최근 기록</div><ul id="log"></ul></div>
<script>
let unit="yd",base=null,cur=null,hist=[];
const $=id=>document.getElementById(id);
try{const s=localStorage.getItem("gd");if(s)hist=JSON.parse(s)}catch(e){}
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function conv(m){return Math.round(unit==="yd"?m*1.09361:m)}
function render(){
  $("u").textContent=unit==="yd"?"야드":"미터";
  if(base&&cur)$("dist").textContent=conv(hav(base,cur));else $("dist").textContent="--";
  $("log").innerHTML=hist.slice(0,8).map(h=>`<li><span>${h.t}</span><b>${conv(h.m)} ${unit==="yd"?"yd":"m"}</b></li>`).join("")||'<li><span class="sub">아직 기록이 없어요</span></li>';
}
function save(){try{localStorage.setItem("gd",JSON.stringify(hist.slice(0,30)))}catch(e){}}
if(!navigator.geolocation){$("state").textContent="이 브라우저는 위치를 지원하지 않아요"}
else navigator.geolocation.watchPosition(p=>{
  cur={lat:p.coords.latitude,lon:p.coords.longitude};
  const a=Math.round(p.coords.accuracy);
  $("state").textContent=`GPS 오차 약 ±${a}m `+(a>10?"(신호 약함, 잠시 기다려 보세요)":"👍")+(base?"":" · 기준점을 저장하세요");
  render();
},e=>{$("state").textContent="위치 권한을 허용해 주세요 (Safari에서 열어야 해요)"},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
$("set").onclick=()=>{if(!cur)return;base={...cur};$("state").textContent="기준점 저장됨 ✅ 이제 이동해 보세요";render()};
$("rec").onclick=()=>{if(!base||!cur)return;const d=new Date();
  hist.unshift({m:hav(base,cur),t:d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")});save();render()};
$("unit").onclick=()=>{unit=unit==="yd"?"m":"yd";render()};
render();
</script>
</body>
</html>
